<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Formats</title>
  <meta name="description" content="Will's edit specs, one place.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Clip Formats</h1>
      <p class="subtitle">Will's edit specs, one place.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel checklist" aria-labelledby="checklist-heading">
      <div class="panel-head">
        <h2 id="checklist-heading">New clip checklist</h2>
        <label class="select-label" for="checklist-format">
          <span>Format</span>
          <select id="checklist-format"></select>
        </label>
      </div>
      <ul id="checklist-items" class="checklist-items"></ul>
      <button type="button" id="checklist-clear" class="btn btn-ghost">Uncheck all</button>
    </section>

    <section aria-labelledby="formats-heading">
      <div class="section-head">
        <h2 id="formats-heading">Formats</h2>
        <button type="button" id="reset-all" class="btn btn-ghost">Reset to defaults</button>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Edits save in this browser only. Use Reset to defaults to restore the original specs.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
